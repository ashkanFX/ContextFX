<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ContextFX Vocabulary</title>
    <link rel="stylesheet" href="print.css" />
  </head>
  <body>
    <main class="report">
      <header class="report-header">
        <p class="eyebrow">ContextFX</p>
        <h1>Saved vocabulary</h1>
        <p id="reportSummary" class="report-summary"></p>
      </header>
      <table>
        <thead>
          <tr>
            <th scope="col">Word</th>
            <th scope="col">Uses</th>
            <th scope="col">Sites</th>
            <th scope="col">Priority</th>
            <th scope="col">Dictionary details</th>
            <th scope="col">Source pages</th>
          </tr>
        </thead>
        <tbody id="vocabularyRows"></tbody>
      </table>
    </main>
    <script src="../src/shared/vocabulary.js"></script>
    <script src="print.js"></script>
  </body>
</html>
