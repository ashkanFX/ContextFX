<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ContextFX — Vocabulary</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="bg-gray-50   text-gray-900">
    <div class="container">
      <header class="header">
        <div>
          <h1 class="title">ContextFX</h1>
          <p class="subtitle">Save and manage vocabulary while you browse.</p>
        </div>
        <div class="note">Entries stored locally</div>
      </header>

      <section class="card">
        <form id="addForm" class="form">
          <input id="wordInput" type="text" placeholder="Word" class="input input-word" />
          <input id="defInput" type="text" placeholder="Definition (optional)" class="input input-def" />
          <button id="addBtn" type="button" class="btn btn-primary">Add</button>
          <input id="search" type="text" placeholder="Search..." class="input input-search" />
        </form>

        <div class="table-wrap">
          <table id="vocabTable" class="table">
            <thead>
              <tr>
                <th>Word</th>
                <th>Definition</th>
                <th>Importance</th>
                <th>Seen</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <footer class="mt-4 text-xs text-gray-500">
        Tip: Use the extension context menu to save words quickly.
      </footer>
    </div>

    <script src="options.js"></script>
  </body>
</html>
